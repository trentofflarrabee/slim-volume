name: PHP Syntax

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap-compatibility:
    name: Bootstrap syntax on PHP 5.6
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP 5.6
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          coverage: none
          tools: none

      - name: Lint compatibility bootstrap
        shell: bash
        run: php -l slim-volume.php

  lint:    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.0'
          - '8.5'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint PHP files
        shell: bash
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 |
            xargs -0 -n1 php -l

      - name: Verify release version consistency
        shell: bash
        run: |
          plugin_header_version="$(
            sed -n "s/^[[:space:]]*\* Version:[[:space:]]*\([^[:space:]]*\).*/\1/p" slim-volume.php |
              head -n 1
          )"

          plugin_constant_version="$(
            sed -n "s/.*define('SLIM_VOLUME_VERSION', '\([^']*\)').*/\1/p" slim-volume.php |
              head -n 1
          )"

          readme_stable_tag="$(
            sed -n "s/^Stable tag:[[:space:]]*\([^[:space:]]*\).*/\1/p" readme.txt |
              head -n 1
          )"

          if [[ -z "$plugin_header_version" || -z "$plugin_constant_version" || -z "$readme_stable_tag" ]]; then
            echo "Could not read all required version values."
            exit 1
          fi

          printf 'Plugin header: %s\nVersion constant: %s\nReadme stable tag: %s\n' \
            "$plugin_header_version" \
            "$plugin_constant_version" \
            "$readme_stable_tag"

          if [[ "$plugin_header_version" != "$plugin_constant_version" || "$plugin_header_version" != "$readme_stable_tag" ]]; then
            echo "Slim Volume release versions do not match."
            exit 1
          fi