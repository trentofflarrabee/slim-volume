name: Distribution Package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Build plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          version="$(
            sed -n "s/^[[:space:]]*\* Version:[[:space:]]*\([^[:space:]]*\).*/\1/p" slim-volume.php |
              head -n 1
          )"

          if [[ -z "$version" ]]; then
            echo "Could not read the plugin version."
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid plugin version: $version"
            exit 1
          fi

          echo "Package version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build distribution archive
        shell: bash
        run: |
          rm -rf build
          mkdir -p build/staging/slim-volume

          rsync -a \
            --exclude-from='.distignore' \
            ./ \
            build/staging/slim-volume/

          (
            cd build/staging
            zip -qr "../slim-volume-${{ steps.version.outputs.version }}.zip" slim-volume
          )

      - name: Verify distribution archive
        shell: bash
        run: |
          archive="build/slim-volume-${{ steps.version.outputs.version }}.zip"
          archive_entries="$(unzip -Z1 "$archive")"

          required_paths=(
            "slim-volume/slim-volume.php"
            "slim-volume/uninstall.php"
            "slim-volume/readme.txt"
            "slim-volume/LICENSE"
          )

          for required_path in "${required_paths[@]}"; do
            if ! grep -Fxq "$required_path" <<< "$archive_entries"; then
              echo "Required package file is missing: $required_path"
              exit 1
            fi
          done

          forbidden_paths=(
            "slim-volume/.git"
            "slim-volume/.github"
            "slim-volume/.gitattributes"
            "slim-volume/.distignore"
            "slim-volume/build"
            "slim-volume/docs"
            "slim-volume/README.md"
          )

          for forbidden_path in "${forbidden_paths[@]}"; do
            if grep -Fq "$forbidden_path" <<< "$archive_entries"; then
              echo "Development file was included: $forbidden_path"
              exit 1
            fi
          done

          echo "Distribution package contents passed validation."
          unzip -l "$archive"

      - name: Generate and verify checksum
        shell: bash
        run: |
          (
            cd build

            sha256sum \
              "slim-volume-${{ steps.version.outputs.version }}.zip" \
              > "slim-volume-${{ steps.version.outputs.version }}.zip.sha256"

            sha256sum \
              --check \
              "slim-volume-${{ steps.version.outputs.version }}.zip.sha256"
          )

      - name: Upload distribution package
        uses: actions/upload-artifact@v4
        with:
          name: slim-volume-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/slim-volume-${{ steps.version.outputs.version }}.zip
            build/slim-volume-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 14